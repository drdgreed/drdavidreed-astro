<svg xmlns="http://www.w3.org/2000/svg" width="520" height="551" viewBox="0 0 400 424" role="img" aria-labelledby="t d"><title id="t">The assembling agent proposes; humans merge</title><desc id="d">Inputs flow to the assembling agent, which writes only a change branch; a human reviews and a human merges. The agent never merges, edits specs or acts in a system of record.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6B66"/></marker></defs><rect width="400" height="424" fill="#EEEDE8"/><rect x="14" y="14" width="236" height="54" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="132.0" y="37.425" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#444441" text-anchor="middle">Inputs</text><text x="132.0" y="55.175" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#444441" text-anchor="middle">source spec · Standard · kit</text><path d="M132,68 L132,86" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="14" y="88" width="236" height="54" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text x="132.0" y="111.425" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#712B13" text-anchor="middle">Assembling agent</text><text x="132.0" y="129.175" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#712B13" text-anchor="middle">Claude Code · harness on</text><path d="M132,142 L132,160" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="14" y="162" width="236" height="54" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="132.0" y="185.425" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3C3489" text-anchor="middle">Change branch</text><text x="132.0" y="203.175" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3C3489" text-anchor="middle">set · ledgers · trace id</text><path d="M132,216 L132,234" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="14" y="236" width="236" height="54" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="132.0" y="259.425" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3C3489" text-anchor="middle">Human review</text><text x="132.0" y="277.175" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3C3489" text-anchor="middle">completeness · reader test</text><path d="M132,290 L132,308" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="14" y="310" width="236" height="54" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="132.0" y="333.425" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#444441" text-anchor="middle">Human merges</text><text x="132.0" y="351.175" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#444441" text-anchor="middle">archive · version bump</text><path d="M250,115 L278,115" fill="none" stroke="#993C1D" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="280" y="80" width="112" height="70" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5" stroke-dasharray="6 5"/><text x="336.0" y="102.8125" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#712B13" text-anchor="middle">Never</text><text x="336.0" y="119.9375" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#712B13" text-anchor="middle">merge · edit</text><text x="336.0" y="136.8375" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#712B13" text-anchor="middle">specs/ · act</text><text x="14" y="400" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start" font-style="italic">Propose-only · HRN-04 unattended profile ·</text><text x="14" y="417" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start" font-style="italic">HRN-05 audits every “done”</text></svg>
