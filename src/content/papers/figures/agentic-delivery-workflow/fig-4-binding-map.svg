<svg xmlns="http://www.w3.org/2000/svg" width="572" height="582" viewBox="0 0 440 448" role="img" aria-labelledby="t d"><title id="t">PRD sections compile into harness controls</title><desc id="d">Six bindings: H9 to HRN-01, H8 to HRN-04, S3.5 to HRN-06, S5.1 to HRN-07, H14 to HRN-05, and S6 to HRN-09 and HRN-10.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6B66"/></marker></defs><rect width="440" height="448" fill="#EEEDE8"/><rect x="10" y="14" width="192" height="54" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="106.0" y="37.262499999999996" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#3C3489" text-anchor="middle">H9 boundaries</text><text x="106.0" y="54.387499999999996" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3C3489" text-anchor="middle">six “never” categories</text><path d="M202,41 L236,41" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="238" y="14" width="192" height="54" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text x="334.0" y="37.262499999999996" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#712B13" text-anchor="middle">HRN-01 permissions</text><text x="334.0" y="54.387499999999996" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#712B13" text-anchor="middle">deny → ask → allow</text><rect x="10" y="80" width="192" height="54" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="106.0" y="103.26249999999999" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#3C3489" text-anchor="middle">H8 DAS positions</text><text x="106.0" y="120.38749999999999" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3C3489" text-anchor="middle">position per action</text><path d="M202,107 L236,107" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="238" y="80" width="192" height="54" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text x="334.0" y="103.26249999999999" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#712B13" text-anchor="middle">HRN-04 unattended</text><text x="334.0" y="120.38749999999999" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#712B13" text-anchor="middle">enforced limits</text><rect x="10" y="146" width="192" height="54" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="106.0" y="169.26250000000002" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#3C3489" text-anchor="middle">S3.5 audit logging</text><text x="106.0" y="186.38750000000002" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3C3489" text-anchor="middle">append-only · trace id</text><path d="M202,173 L236,173" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="238" y="146" width="192" height="54" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text x="334.0" y="169.26250000000002" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#712B13" text-anchor="middle">HRN-06 ledgers</text><text x="334.0" y="186.38750000000002" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#712B13" text-anchor="middle">off-host · write-once</text><rect x="10" y="212" width="192" height="54" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>