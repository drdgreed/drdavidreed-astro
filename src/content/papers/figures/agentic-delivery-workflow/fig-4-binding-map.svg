<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 690" width="1120" height="690" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img"><title>Figure 4 — Six PRD sections and the harness controls they compile into</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1a1aa"/></marker></defs><rect width="1120" height="690" rx="14" fill="#0a0a0a"/><rect x="40" y="30" width="420" height="78" rx="10" fill="#1b1b3a" stroke="#818cf8" stroke-width="1.6"/><text x="250.0" y="63.0" fill="#e0e7ff" font-size="17" font-weight="700" text-anchor="middle">H8 DAS · H9 · S3.2</text><text x="250.0" y="87.0" fill="#a5b4fc" font-size="13.5" font-weight="400" text-anchor="middle">PROHIBITED, HITL-REQUIRED, “No” cells</text><rect x="660" y="30" width="420" height="78" rx="10" fill="#2a1608" stroke="#fb923c" stroke-width="1.6"/><text x="870.0" y="63.0" fill="#ffedd5" font-size="17" font-weight="700" text-anchor="middle">HRN-01 permission model</text><text x="870.0" y="87.0" fill="#fdba74" font-size="13.5" font-weight="400" text-anchor="middle">deny · ask · allow, each citing its boundary</text><path d="M468,69 H652" fill="none" stroke="#a1a1aa" stroke-width="1.6" marker-end="url(#ah)"/><rect x="40" y="130" width="420" height="78" rx="10" fill="#1b1b3a" stroke="#818cf8" stroke-width="1.6"/><text x="250.0" y="163.0" fill="#e0e7ff" font-size="17" font-weight="700" text-anchor="middle">H8 DAS positions</text><text x="250.0" y="187.0" fill="#a5b4fc" font-size="13.5" font-weight="400" text-anchor="middle">HUMAN-ONLY · HITL-REQUIRED</text><rect x="660" y="130" width="420" height="78" rx="10" fill="#2a1608" stroke="#fb923c" stroke-width="1.6"/><text x="870.0" y="163.0" fill="#ffedd5" font-size="17" font-weight="700" text-anchor="middle">HRN-04 unattended profile</text><text x="870.0" y="187.0" fill="#fdba74" font-size="13.5" font-weight="400" text-anchor="middle">prepares; never executes a consequential act</text><path d="M468,169 H652" fill="none" stroke="#a1a1aa" stroke-width="1.6" marker-end="url(#ah)"/><rect x="40" y="230" width="420" height="78" rx="10" fill="#1b1b3a" stroke="#818cf8" stroke-width="1.6"/><text x="250.0" y="263.0" fill="#e0e7ff" font-size="17" font-weight="700" text-anchor="middle">S3.5 audit · S6 change record</text><text x="250.0" y="287.0" fill="#a5b4fc" font-size="13.5" font-weight="400" text-anchor="middle">append-only · correlation ID</text><rect x="660" y="230" width="420" height="78" rx="10" fill="#2a1608" stroke="#fb923c" stroke-width="1.6"/><text x="870.0" y="263.0" fill="#ffedd5" font-size="17" font-weight="700" text-anchor="middle">HRN-06 ledgers</text><text x="870.0" y="287.0" fill="#fdba74" font-size="13.5" font-weight="400" text-anchor="middle">off-host · write-once</text><path d="M468,269 H652" fill="none" stroke="#a1a1aa" stroke-width="1.6" marker-end="url(#ah)"/><rect x="40" y="330" width="420" height="78" rx="10" fill="#1b1b3a" stroke="#818cf8" stroke-width="1.6"/><text x="250.0" y="363.0" fill="#e0e7ff" font-size="17" font-weight="700" text-anchor="middle">S5.1 observability</text><text x="250.0" y="387.0" fill="#a5b4fc" font-size="13.5" font-weight="400" text-anchor="middle">one span per agent call</text><rect x="660" y="330" width="420" height="78" rx="10" fill="#2a1608" stroke="#fb923c" stroke-width="1.6"/><text x="870.0" y="363.0" fill="#ffedd5" font-size="17" font-weight="700" text-anchor="middle">HRN-07 telemetry</text><text x="870.0" y="387.0" fill="#fdba74" font-size="13.5" font-weight="400" text-anchor="middle">GenAI semantic conventions</text><path d="M468,369 H652" fill="none" stroke="#a1a1aa" stroke-width="1.6" marker-end="url(#ah)"/><rect x="40" y="430" width="420" height="78" rx="10" fill="#1b1b3a" stroke="#818cf8" stroke-width="1.6"/><text x="250.0" y="463.0" fill="#e0e7ff" font-size="17" font-weight="700" text-anchor="middle">H14 honest-claims matrix</text><text x="250.0" y="487.0" fill="#a5b4fc" font-size="13.5" font-weight="400" text-anchor="middle">specified vs demonstrated</text><rect x="660" y="430" width="420" height="78" rx="10" fill="#2a1608" stroke="#fb923c" stroke-width="1.6"/><text x="870.0" y="463.0" fill="#ffedd5" font-size="17" font-weight="700" text-anchor="middle">HRN-05 claim auditor</text><text x="870.0" y="487.0" fill="#fdba74" font-size="13.5" font-weight="400" text-anchor="middle">“demonstrated” only with a run ID</text><path d="M468,469 H652" fill="none" stroke="#a1a1aa" stroke-width="1.6" marker-end="url(#ah)"/><rect x="40" y="530" width="420" height="78" rx="10" fill="#1b1b3a" stroke="#818cf8" stroke-width="1.6"/><text x="250.0" y="563.0" fill="#e0e7ff" font-size="17" font-weight="700" text-anchor="middle">S6.2 change control</text><text x="250.0" y="587.0" fill="#a5b4fc" font-size="13.5" font-weight="400" text-anchor="middle">one publisher · no local edits</text><rect x="660" y="530" width="420" height="78" rx="10" fill="#2a1608" stroke="#fb923c" stroke-width="1.6"/><text x="870.0" y="563.0" fill="#ffedd5" font-size="17" font-weight="700" text-anchor="middle">HRN-09 distribution</text><text x="870.0" y="587.0" fill="#fdba74" font-size="13.5" font-weight="400" text-anchor="middle">manifest · checksum · resync</text><path d="M468,569 H652" fill="none" stroke="#a1a1aa" stroke-width="1.6" marker-end="url(#ah)"/><rect x="40" y="645" width="18" height="18" rx="4" fill="#1b1b3a" stroke="#818cf8" stroke-width="1.4"/><text x="68" y="659" fill="#a1a1aa" font-size="13.5" font-weight="400" text-anchor="start">PRD document-set section</text><rect x="262.4" y="645" width="18" height="18" rx="4" fill="#2a1608" stroke="#fb923c" stroke-width="1.4"/><text x="290.4" y="659" fill="#a1a1aa" font-size="13.5" font-weight="400" text-anchor="start">Harness control</text></svg>
