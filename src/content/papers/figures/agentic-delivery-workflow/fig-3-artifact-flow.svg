<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img"><title>Figure 3 — Three frameworks, one document set per agentic system</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1a1aa"/></marker></defs><rect width="1120" height="560" rx="14" fill="#0a0a0a"/><rect x="40" y="30" width="320" height="78" rx="10" fill="#1b1b3a" stroke="#818cf8" stroke-width="1.6"/><text x="200.0" y="63.0" fill="#e0e7ff" font-size="17" font-weight="700" text-anchor="middle">Agentic PRD Standard v3.10.2</text><text x="200.0" y="87.0" fill="#a5b4fc" font-size="13.5" font-weight="400" text-anchor="middle">hub H0–H14 · spokes S1–S6 · M</text><rect x="400" y="30" width="320" height="78" rx="10" fill="#06281e" stroke="#34d399" stroke-width="1.6"/><text x="560.0" y="63.0" fill="#d1fae5" font-size="17" font-weight="700" text-anchor="middle">SDD v1.0.3</text><text x="560.0" y="87.0" fill="#6ee7b7" font-size="13.5" font-weight="400" text-anchor="middle">four layers · contracts · IDs</text><rect x="760" y="30" width="320" height="78" rx="10" fill="#2a1608" stroke="#fb923c" stroke-width="1.6"/><text x="920.0" y="63.0" fill="#ffedd5" font-size="17" font-weight="700" text-anchor="middle">Harness Specification v1.3</text><text x="920.0" y="87.0" fill="#fdba74" font-size="13.5" font-weight="400" text-anchor="middle">Gates 0–4 · HRN-01..12</text><path d="M200.0,108 V176" fill="none" stroke="#a1a1aa" stroke-width="1.6" marker-end="url(#ah)"/><path d="M560.0,108 V176" fill="none" stroke="#a1a1aa" stroke-width="1.6" marker-end="url(#ah)"/><path d="M920.0,108 V176" fill="none" stroke="#a1a1aa" stroke-width="1.6" marker-end="url(#ah)"/><rect x="40" y="180" width="1040" height="200" rx="10" fill="#18181b" stroke="#71717a" stroke-width="1.6" stroke-dasharray="7 5"/><text x="560.0" y="286.0