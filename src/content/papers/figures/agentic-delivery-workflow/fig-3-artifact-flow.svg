<svg xmlns="http://www.w3.org/2000/svg" width="546" height="588" viewBox="0 0 420 452" role="img" aria-labelledby="t d"><title id="t">Three frameworks converge on one document set</title><desc id="d">The Agentic PRD Standard, Specification-Driven Design and the Harness Specification each feed one product document set — hub, spokes, machine-readable spec and harness binding — which yields a registry entry, ledgers and traces, and the deployed agent.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6B66"/></marker></defs><rect width="420" height="452" fill="#EEEDE8"/><rect x="12" y="14" width="128" height="78" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="76.0" y="40.199999999999996" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#3C3489" text-anchor="middle">Agentic PRD</text><text x="76.0" y="58.324999999999996" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#3C3489" text-anchor="middle">Standard</text><text x="76.0" y="75.44999999999999" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3C3489" text-anchor="middle">hub · S1–S6 · M</text><path d="M76,92 L76,112" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="146" y="14" width="128" height="78" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="210.0" y="40.199999999999996" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#085041" text-anchor="middle">Specification-</text><text x="210.0" y="58.324999999999996" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#085041" text-anchor="middle">Driven Design</text><text x="210.0" y="75.44999999999999" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="middle">four layers · IDs</text><path d="M210,92 L210,112" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="280" y="14" width="128" height="78" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text x="344.0" y="40.199999999999996" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#712B13" text-anchor="middle">Harness</text><text x="344.0" y="58.324999999999996" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#712B13" text-anchor="middle">Specification</text><text x="344.0" y="75.44999999999999" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#712B13" text-anchor="middle">Gates 0–4 · HRN</text><path d="M344,92 L344,112" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="12" y="114" width="396" height="190" rx="12" fill="#EFEEE9" stroke="#8A8A85" stroke-width="1.3" stroke-dasharray="6 5"/><text x="26" y="138" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#444441" text-anchor="start">Product document set (one per system)</text><rect x="26" y="150" width="180" height="50" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="116.0" y="171.26250000000002" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#3C3489" text-anchor="middle">Hub</text><text x="116.0" y="188.38750000000002" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3C3489" text-anchor="middle">claims · boundaries</text><rect x="214" y="150" width="180" height="50" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="304.0" y="171.26250000000002" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#085041" text-anchor="middle">Spokes S1–S6</text><text x="304.0" y="188.38750000000002" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="middle">in SDD form</text><rect x="26" y="210" width="180" height="50" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="116.0" y="231.26250000000002" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#3C3489" text-anchor="middle">M</text><text x="116.0" y="248.38750000000002" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3C3489" text-anchor="middle">specs · deltas</text><rect x="214" y="210" width="180" height="50" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text x="304.0" y="231.26250000000002" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#712B13" text-anchor="middle">Harness binding</text><text x="304.0" y="248.38750000000002" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#712B13" text-anchor="middle">settings · hooks</text><text x="210" y="290" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="middle" font-style="italic">All cite by ID; only the hub claims.</text><path d="M76,304 L76,330" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="12" y="332" width="128" height="74" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="76.0" y="356.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#444441" text-anchor="middle">Registry</text><text x="76.0" y="374.325" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#444441" text-anchor="middle">entry</text><text x="76.0" y="391.45" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#444441" text-anchor="middle">identity · tier</text><path d="M210,304 L210,330" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="146" y="332" width="128" height="74" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="210.0" y="356.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#444441" text-anchor="middle">Ledgers and</text><text x="210.0" y="374.325" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#444441" text-anchor="middle">traces</text><text x="210.0" y="391.45" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#444441" text-anchor="middle">HRN-06 · 07</text><path d="M344,304 L344,330" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="280" y="332" width="128" height="74" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="344.0" y="356.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#444441" text-anchor="middle">Deployed</text><text x="344.0" y="374.325" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#444441" text-anchor="middle">agent</text><text x="344.0" y="391.45" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#444441" text-anchor="middle">Gate 4 · SLOs</text><rect x="12" y="425" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.3"/><text x="32" y="436" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">Standard</text><rect x="110.24000000000001" y="425" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/><text x="130.24" y="436" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">SDD</text><rect x="172.08" y="425" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1.3"/><text x="192.08" y="436" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">Harness</text><rect x="263.04" y="425" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.3"/><text x="283.04" y="436" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">Output</text></svg>
