<svg xmlns="http://www.w3.org/2000/svg" width="546" height="952" viewBox="0 0 420 732" role="img" aria-labelledby="t d"><title id="t">Agentic Delivery Workflow: eight stages</title><desc id="d">W0 intake, W1 hub, then W2 SDD specification and W3 evaluation specification in parallel, then W4 harness binding, W5 build, W6 evaluation and red team, W7 deploy and monitor, and a change gate that returns deltas to W5 or W7. Colors show which framework’s gate closes each stage.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6B66"/></marker></defs><rect width="420" height="732" fill="#EEEDE8"/><rect x="75.0" y="16" width="270" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text x="210.0" y="40.425" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#712B13" text-anchor="middle">W0 Intake and classify</text><text x="210.0" y="58.175" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#712B13" text-anchor="middle">Gate 0 · worksheet</text><path d="M210,72 L210,92" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="75.0" y="94" width="270" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="210.0" y="118.425" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3C3489" text-anchor="middle">W1 Hub</text><text x="210.0" y="136.175" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3C3489" text-anchor="middle">H0–H14 · completeness</text><path d="M210,150 L210,160 L113,160 L113,172" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><path d="M210,160 L307,160 L307,172" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="30" y="174" width="166" height="62" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="113.0" y="192.20000000000002" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#085041" text-anchor="middle">W2 SDD</text><text x="113.0" y="210.32500000000002" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#085041" text-anchor="middle">specification</text><text x="113.0" y="227.45000000000002" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="middle">Gate 1</text><rect x="224" y="174" width="166" height="62" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="307.0" y="192.20000000000002" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#3C3489" text-anchor="middle">W3 Eval spec</text><text x="307.0" y="210.32500000000002" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#3C3489" text-anchor="middle">and M</text><text x="307.0" y="227.45000000000002" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3C3489" text-anchor="middle">S2 · M · reader test</text><path d="M113,236 L113,246 L210,246" fill="none" stroke="#6B6B66" stroke-width="1.6"/><path d="M307,236 L307,246 L210,246 L210,256" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="75.0" y="258" width="270" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text x="210.0" y="282.425" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#712B13" text-anchor="middle">W4 Harness binding</text><text x="210.0" y="300.175" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#712B13" text-anchor="middle">Gate 2 · HRN-01..12</text><path d="M210,314 L210,334" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="75.0" y="336" width="270" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text x="210.0" y="360.425" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#712B13" text-anchor="middle">W5 Build under harness</text><text x="210.0" y="378.175" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#712B13" text-anchor="middle">claim auditor · ledgers</text><path d="M210,392 L210,412" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="75.0" y="414" width="270" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text x="210.0" y="438.425" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#712B13" text-anchor="middle">W6 Eval and red team</text><text x="210.0" y="456.175" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#712B13" text-anchor="middle">Gate 3 · κ · ATLAS</text><path d="M210,470 L210,490" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="75.0" y="492" width="270" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text x="210.0" y="516.425" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#712B13" text-anchor="middle">W7 Deploy and monitor</text><text x="210.0" y="534.175" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#712B13" text-anchor="middle">Gate 4 · SLOs · drift</text><path d="M210,548 L210,568" fill="none" stroke="#6B6B66" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="75.0" y="570" width="270" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="6 5"/><text x="210.0" y="594.425" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#444441" text-anchor="middle">Change gate</text><text x="210.0" y="612.175" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#444441" text-anchor="middle">spec deltas return to M</text><path d="M345.0,598 L392,598 L392,364 L347.0,364" fill="none" stroke="#6B6B66" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="398" y="352" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#5F5E5A" text-anchor="middle">W5</text><path d="M75.0,598 L28,598 L28,520 L73.0,520" fill="none" stroke="#6B6B66" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="22" y="508" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#5F5E5A" text-anchor="middle">W7</text><rect x="16" y="645" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.3"/><text x="36" y="656" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">PRD Standard</text><rect x="143.36" y="645" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/><text x="163.36" y="656" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">SDD</text><rect x="205.20000000000002" y="645" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1.3"/><text x="225.20000000000002" y="656" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">Harness Spec</text><text x="16" y="680" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">Color: whose gate closes the stage.</text><text x="16" y="700" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">Dashed returns: code or behavior → W5;</text><text x="16" y="718" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">configuration only → W7.</text></svg>
