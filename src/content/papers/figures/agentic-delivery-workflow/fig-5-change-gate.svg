<svg xmlns="http://www.w3.org/2000/svg" width="468" height="715" viewBox="0 0 360 550" role="img" aria-labelledby="t d"><title id="t">The change gate loop</title><desc id="d">Trigger, spec delta, suites pass, owners approve, archive into specs, re-run the proportionality worksheet; code or behavior changes return to W5 and configuration-only changes to W7.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6B66"/></marker></defs><rect width="360" height="550" fill="#EEEDE8"/><rect x="40" y="14" width="280" height="62" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="180.0" y="32.974999999999994" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#444441" text-anchor="middle">Trigger</text><text x="180.0" y="50.724999999999994" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#444441" text-anchor="middle">drift · request · standards</text><text x="180.0" y="67.625" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#444441" text-anchor="middle">change · size rule</text><path d="M180,76 L180,94" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="40" y="96" width="280" height="54" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="180.0" y="119.425" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3C3489" text-anchor="middle">Spec delta</text><text x="180.0" y="137.175" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3C3489" text-anchor="middle">predicted fix and risk</text><path d="M180,150 L180,168" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="40" y="170" width="280" height="54" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text x="180.0" y="193.425" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#712B13" text-anchor="middle">Suites pass</text><text x="180.0" y="211.175" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#712B13" text-anchor="middle">regression + boundary</text><path d="M180,224 L180,242" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="40" y="244" width="280" height="54" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="180.0" y="267.425" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3C3489" text-anchor="middle">Owners approve</text><text x="180.0" y="285.175" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3C3489" text-anchor="middle">spoke owners · AI Risk Officer</text><path d="M180,298 L180,316" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="40" y="318" width="280" height="54" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="180.0" y="341.425" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3C3489" text-anchor="middle">Archive</text><text x="180.0" y="359.175" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3C3489" text-anchor="middle">into specs/ · version advances</text><path d="M180,372 L180,390" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="40" y="392" width="280" height="54" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="6 5"/><text x="180.0" y="415.425" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#444441" text-anchor="middle">Re-run worksheet</text><text x="180.0" y="433.175" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#444441" text-anchor="middle">proportionality T1–T7</text><path d="M180,446 L180,464" fill="none" stroke="#6B6B66" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="40" y="466" width="280" height="70" rx="10" fill="#FFFFFF" stroke="#8A8A85" stroke-width="1.5"/><text x="180.0" y="488.975" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#333333" text-anchor="middle">Return to</text><text x="180.0" y="506.725" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="middle">W5 for code or behavior</text><text x="180.0" y="523.625" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="middle">W7 for configuration only</text></svg>
