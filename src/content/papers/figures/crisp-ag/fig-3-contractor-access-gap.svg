<svg xmlns="http://www.w3.org/2000/svg" width="572" height="745" viewBox="0 0 440 573" role="img" aria-labelledby="t d"><title id="t">The contractor access gap</title><desc id="d">Left, what a contractor cannot do directly: access vendor pricing data, view contract negotiation terms, query internal spend analysis, see strategic supplier assessments; direct access is correctly blocked. Right, what an agent can do for the same person without Contractor Access Governance: retrieve pricing in agent outputs, surface contract terms in summaries, include spend data in reports, reference strategic assessments. Same person, different access. The solution is a Contractor Access Profile, produced before architecture design begins.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6B66"/></marker></defs><rect width="440" height="573" fill="#EEEDE8"/><rect x="10" y="12" width="205" height="61" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="22" y="37.28" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#085041" text-anchor="start">What a contractor cannot</text><text x="22" y="57.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#085041" text-anchor="start">do directly</text><rect x="225" y="12" width="205" height="61" rx="9" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text x="237" y="37.28" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#712B13" text-anchor="start">What an agent can do</text><text x="237" y="57.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#712B13" text-anchor="start">without CAG</text><rect x="10" y="83" width="205" height="57" rx="9" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1.5"/><rect x="225" y="83" width="205" height="57" rx="9" fill="#FFFFFF" stroke="#993C1D" stroke-width="1.5"/><text x="44" y="106.82" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Access vendor pricing</text><text x="44" y="124.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">data</text><text x="259" y="106.82" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Retrieve pricing in agent</text><text x="259" y="124.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">outputs</text><circle cx="28" cy="111.5" r="8.5" fill="#0F6E56"/><path d="M24.5,108.0 L31.5,115.0 M31.5,108.0 L24.5,115.0" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/><path d="M243,102.5 L252.5,119.0 L233.5,119.0 z" fill="#993C1D" stroke="#993C1D" stroke-width="1.5" stroke-linejoin="round"/><path d="M243,108.0 L243,113.0" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/><circle cx="243" cy="116.1" r="1.2" fill="#FFFFFF"/><rect x="10" y="148" width="205" height="57" rx="9" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1.5"/><rect x="225" y="148" width="205" height="57" rx="9" fill="#FFFFFF" stroke="#993C1D" stroke-width="1.5"/><text x="44" y="171.82" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">View contract negotiation</text><text x="44" y="189.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">terms</text><text x="259" y="171.82" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Surface contract terms in</text><text x="259" y="189.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">summaries</text><circle cx="28" cy="176.5" r="8.5" fill="#0F6E56"/><path d="M24.5,173.0 L31.5,180.0 M31.5,173.0 L24.5,180.0" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/><path d="M243,167.5 L252.5,184.0 L233.5,184.0 z" fill="#993C1D" stroke="#993C1D" stroke-width="1.5" stroke-linejoin="round"/><path d="M243,173.0 L243,178.0" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/><circle cx="243" cy="181.1" r="1.2" fill="#FFFFFF"/><rect x="10" y="213" width="205" height="57" rx="9" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1.5"/><rect x="225" y="213" width="205" height="57" rx="9" fill="#FFFFFF" stroke="#993C1D" stroke-width="1.5"/><text x="44" y="236.82" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Query internal spend</text><text x="44" y="254.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">analysis</text><text x="259" y="236.82" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Include spend data in</text><text x="259" y="254.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">reports</text><circle cx="28" cy="241.5" r="8.5" fill="#0F6E56"/><path d="M24.5,238.0 L31.5,245.0 M31.5,238.0 L24.5,245.0" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/><path d="M243,232.5 L252.5,249.0 L233.5,249.0 z" fill="#993C1D" stroke="#993C1D" stroke-width="1.5" stroke-linejoin="round"/><path d="M243,238.0 L243,243.0" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/><circle cx="243" cy="246.1" r="1.2" fill="#FFFFFF"/><rect x="10" y="278" width="205" height="57" rx="9" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1.5"/><rect x="225" y="278" width="205" height="57" rx="9" fill="#FFFFFF" stroke="#993C1D" stroke-width="1.5"/><text x="44" y="301.82" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">See strategic supplier</text><text x="44" y="319.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">assessments</text><text x="259" y="301.82" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Reference strategic</text><text x="259" y="319.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">assessments</text><circle cx="28" cy="306.5" r="8.5" fill="#0F6E56"/><path d="M24.5,303.0 L31.5,310.0 M31.5,303.0 L24.5,310.0" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/><path d="M243,297.5 L252.5,314.0 L233.5,314.0 z" fill="#993C1D" stroke="#993C1D" stroke-width="1.5" stroke-linejoin="round"/><path d="M243,303.0 L243,308.0" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/><circle cx="243" cy="311.1" r="1.2" fill="#FFFFFF"/><rect x="10" y="347" width="205" height="51" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="22" y="367.82" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#085041" text-anchor="start">Direct access: correctly</text><text x="22" y="385.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#085041" text-anchor="start">blocked</text><rect x="225" y="347" width="205" height="51" rx="9" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text x="237" y="367.82" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#712B13" text-anchor="start">Agent-mediated access: a</text><text x="237" y="385.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#712B13" text-anchor="start">gap without explicit controls</text><path d="M152.5,424 L287.5,424" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="220.0" y="415" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#5F5E5A" text-anchor="middle" font-style="italic">Same person, different access</text><rect x="10" y="444" width="420" height="117" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="22" y="469.26" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#3C3489" text-anchor="start">Solution: a Contractor Access Profile (CAP), produced</text><text x="22" y="488.98" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#3C3489" text-anchor="start">before architecture design begins</text><text x="22" y="510.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">The agent’s effective access in a session is the intersection of</text><text x="22" y="527.88" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">its own access and the invoking user’s scope, not the union</text><text x="22" y="545.56" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">(§5.2).</text></svg>
