<svg xmlns="http://www.w3.org/2000/svg" width="572" height="1266" viewBox="0 0 440 974" role="img" aria-labelledby="t d"><title id="t">The Orchestration Contract</title><desc id="d">The fields of the contract written for each sub-agent: role, input schema, output schema with expected ranges and enumerations, per-hop output validation, HITL triggers, failure modes with a retry, degrade or abort policy, data-tier constraints, latency SLA and audit log. One contract serves as the implementation specification, the test specification and the audit artifact. Across a pipeline the contracts roll up to a pipeline policy with a blast-radius budget, a consumption budget and the halt-the-line rule.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6B66"/></marker></defs><rect width="440" height="974" fill="#EEEDE8"/><rect x="10" y="12" width="420" height="494" rx="11" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="22" y="38" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5F5E5A" text-anchor="start">Contract fields (one contract per sub-agent)</text><text x="22" y="72.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#3C3489" text-anchor="start">Role</text><text x="162" y="72.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">What the sub-agent does and returns</text><path d="M20,86 L420,86" stroke="#534AB7" stroke-opacity="0.3" stroke-width="1"/><text x="22" y="106.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#3C3489" text-anchor="start">Input schema</text><text x="162" y="106.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Types, constraints, required and optional</text><text x="162" y="123.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">fields</text><path d="M20,135 L420,135" stroke="#534AB7" stroke-opacity="0.3" stroke-width="1"/><text x="22" y="155.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#3C3489" text-anchor="start">Output schema</text><text x="162" y="155.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Types plus expected ranges and</text><text x="162" y="172.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">enumerations; data tier per field</text><path d="M20,184 L420,184" stroke="#534AB7" stroke-opacity="0.3" stroke-width="1"/><text x="22" y="204.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#3C3489" text-anchor="start">Output validation</text><text x="162" y="204.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Each downstream hop checks upstream</text><text x="162" y="221.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">output against those ranges and rejects</text><text x="162" y="239.36" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">what falls outside</text><path d="M20,251 L420,251" stroke="#534AB7" stroke-opacity="0.3" stroke-width="1"/><text x="22" y="271.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#3C3489" text-anchor="start">HITL triggers</text><text x="162" y="271.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Boolean predicates that halt autonomous</text><text x="162" y="288.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">execution for human review</text><path d="M20,300 L420,300" stroke="#534AB7" stroke-opacity="0.3" stroke-width="1"/><text x="22" y="320.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#3C3489" text-anchor="start">Failure modes</text><text x="162" y="320.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Degradation policy per failure type: retry,</text><text x="162" y="337.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">degrade or abort</text><path d="M20,349 L420,349" stroke="#534AB7" stroke-opacity="0.3" stroke-width="1"/><text x="22" y="369.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#3C3489" text-anchor="start">Data-tier</text><text x="22" y="389.22" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#3C3489" text-anchor="start">constraints</text><text x="162" y="369.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Which tiers may be read, and which may</text><text x="162" y="386.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">appear in outputs</text><path d="M20,402 L420,402" stroke="#534AB7" stroke-opacity="0.3" stroke-width="1"/><text x="22" y="422.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#3C3489" text-anchor="start">Latency SLA</text><text x="162" y="422.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">P95 target for this agent’s segment of</text><text x="162" y="439.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">the workflow</text><path d="M20,451 L420,451" stroke="#534AB7" stroke-opacity="0.3" stroke-width="1"/><text x="22" y="471.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#3C3489" text-anchor="start">Audit log</text><text x="162" y="471.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Inputs, tool calls, model version and the</text><text x="162" y="488.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">AIR identity the call ran under</text><path d="M220,506 L220,520 L78,520 L78,534" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><path d="M220,520 L220,534" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><path d="M220,520 L362,520 L362,534" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="10" y="536" width="136" height="58" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="78.0" y="560.65" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#444441" text-anchor="middle">Implementation</text><text x="78.0" y="578.775" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#444441" text-anchor="middle">specification</text><rect x="152" y="536" width="136" height="58" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="220.0" y="560.65" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#444441" text-anchor="middle">Test</text><text x="220.0" y="578.775" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#444441" text-anchor="middle">specification</text><rect x="294" y="536" width="136" height="58" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="362.0" y="560.65" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#444441" text-anchor="middle">Audit</text><text x="362.0" y="578.775" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#444441" text-anchor="middle">artifact</text><text x="10" y="624" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5F5E5A" text-anchor="start">Across a pipeline, the contracts roll up to:</text><rect x="10" y="634" width="420" height="264" rx="11" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text x="22" y="659" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#712B13" text-anchor="start">Pipeline policy (§7.2)</text><text x="22" y="690.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#712B13" text-anchor="start">Blast-radius</text><text x="22" y="710.22" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#712B13" text-anchor="start">budget</text><text x="162" y="690.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Downstream actions allowed on</text><text x="162" y="707.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">unvalidated output before a mandatory</text><text x="162" y="725.3599999999999" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">human checkpoint</text><path d="M20,737 L420,737" stroke="#993C1D" stroke-opacity="0.3" stroke-width="1"/><text x="22" y="757.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#712B13" text-anchor="start">Consumption</text><text x="22" y="777.22" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#712B13" text-anchor="start">budget</text><text x="162" y="757.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Model calls, tokens or credits per run and</text><text x="162" y="774.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">per period, enforced outside the model</text><path d="M20,790 L420,790" stroke="#993C1D" stroke-opacity="0.3" stroke-width="1"/><text x="22" y="810.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#712B13" text-anchor="start">Halt the line</text><text x="162" y="810.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Stop when a budget is exhausted, a</text><text x="162" y="827.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">failure mode recurs across hops, or a</text><text x="162" y="845.3599999999999" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">HITL-REQUIRED action meets degraded</text><text x="162" y="863.0399999999998" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">input; resumption needs recorded</text><text x="162" y="880.7199999999998" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">evidence</text><text x="10" y="924" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">Contracts are produced in Phase 5 for every sub-agent of a Class 3</text><text x="10" y="942" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">or 4 system; the pipeline policy is approved with the Phase 6 threat</text><text x="10" y="960" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">model.</text></svg>
