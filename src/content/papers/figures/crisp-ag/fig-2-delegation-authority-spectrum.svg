<svg xmlns="http://www.w3.org/2000/svg" width="546" height="919" viewBox="0 0 420 707" role="img" aria-labelledby="t d"><title id="t">Delegation Authority Spectrum</title><desc id="d">The five DAS positions from full human control to full agent autonomy, each with its meaning and an example procurement action: PROHIBITED, waive a compliance requirement; HUMAN-ONLY, contract negotiation strategy; HITL-REQUIRED, vendor approval; AGENT-DIRECTED, qualification recommendation; FULLY-AUTONOMOUS, document fetch or validation. Each action’s position is approved by Legal, Operations and the Executive Sponsor, with Responsible AI or Privacy where required and Finance or Procurement where the action consumes metered vendor capacity, before technical work begins.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6B66"/></marker></defs><rect width="420" height="707" fill="#EEEDE8"/><text x="10" y="24" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5F5E5A" text-anchor="start">Full human control</text><rect x="40" y="36" width="370" height="79" rx="9" fill="#FBE4E1" stroke="#B42318" stroke-width="1.5"/><text x="52" y="61.46000000000001" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#7A1A12" text-anchor="start">PROHIBITED</text><text x="52" y="79.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">The agent may not perform or assist execution.</text><text x="52" y="99.36000000000001" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7A1A12" text-anchor="start" font-style="italic">Example: Waive a compliance requirement</text><rect x="40" y="125" width="370" height="97" rx="9" fill="#FDEAD9" stroke="#C4540A" stroke-width="1.5"/><text x="52" y="150.62" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#7A3506" text-anchor="start">HUMAN-ONLY</text><text x="52" y="168.84" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">The agent may research or draft; a human decides and</text><text x="52" y="186.52" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">executes.</text><text x="52" y="206.20000000000002" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7A3506" text-anchor="start" font-style="italic">Example: Contract negotiation strategy</text><rect x="40" y="232" width="370" height="97" rx="9" fill="#FBF1CC" stroke="#A47A00" stroke-width="1.5"/><text x="52" y="257.62" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#5C4500" text-anchor="start">HITL-REQUIRED</text><text x="52" y="275.84000000000003" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">The agent prepares the action; a qualified human</text><text x="52" y="293.52000000000004" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">approves before execution.</text><text x="52" y="313.20000000000005" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#5C4500" text-anchor="start" font-style="italic">Example: Vendor approval</text><rect x="40" y="339" width="370" height="97" rx="9" fill="#E9F2D8" stroke="#5C8A1E" stroke-width="1.5"/><text x="52" y="364.62" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#33500E" text-anchor="start">AGENT-DIRECTED</text><text x="52" y="382.84000000000003" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">The agent executes within bounds; a human reviews the</text><text x="52" y="400.52000000000004" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">output or a sample.</text><text x="52" y="420.20000000000005" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#33500E" text-anchor="start" font-style="italic">Example: Qualification recommendation</text><rect x="40" y="446" width="370" height="97" rx="9" fill="#D8EEDE" stroke="#1E7A3E" stroke-width="1.5"/><text x="52" y="471.62" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0E4A23" text-anchor="start">FULLY-AUTONOMOUS</text><text x="52" y="489.84000000000003" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">The agent executes without per-instance review;</text><text x="52" y="507.52000000000004" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">reversible, low-consequence actions only.</text><text x="52" y="527.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0E4A23" text-anchor="start" font-style="italic">Example: Document fetch or validation</text><defs><linearGradient id="das" x1="0" y1="0" x2="0" y2="1"><stop offset="0.00" stop-color="#B42318"/><stop offset="0.25" stop-color="#C4540A"/><stop offset="0.50" stop-color="#A47A00"/><stop offset="0.75" stop-color="#5C8A1E"/><stop offset="1.00" stop-color="#1E7A3E"/></linearGradient></defs><rect x="15" y="36" width="8" height="497" rx="4" fill="url(#das)"/><path d="M11,531 L27,531 L19,543 z" fill="#1E7A3E"/><text x="10" y="565" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5F5E5A" text-anchor="start">Full agent autonomy</text><rect x="10" y="581" width="400" height="114" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="22" y="606.28" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#3C3489" text-anchor="start">Approved before technical work begins</text><text x="22" y="626.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Each action’s position is signed by Legal, Operations and the</text><text x="22" y="644.18" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Executive Sponsor, with Responsible AI / Privacy where</text><text x="22" y="661.8599999999999" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">required and Finance / Procurement (or the Vendor Control</text><text x="22" y="679.5399999999998" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Owner) where the action is metered (§5.1.1).</text></svg>
