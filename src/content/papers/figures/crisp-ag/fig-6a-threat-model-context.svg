<svg xmlns="http://www.w3.org/2000/svg" width="572" height="952" viewBox="0 0 440 732" role="img" aria-labelledby="t d"><title id="t">Agentic threat model, part 1: context surfaces</title><desc id="d">Threat sources — users including contractors and vendor users, documents, e-mail, web pages, database text and external tool responses — enter through four surfaces: the input handler (LLM01, ASI01), context retrieval (LLM01, MCP06, MCP10), the memory and prompt store (ASI06, LLM08) and the session context (MCP06, MCP10). Each surface is paired with its CRISP-AG mitigation. The assembled context feeds LLM reasoning, which continues in Figure 6b.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6B66"/></marker></defs><rect width="440" height="732" fill="#EEEDE8"/><rect x="10" y="12" width="420" height="92" rx="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="21" y="35.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#444441" text-anchor="start">Threat sources</text><text x="21" y="53.66" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Users, including contractors and vendor users;</text><text x="21" y="71.34" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">documents, e-mail, web pages, database text;</text><text x="21" y="89.01999999999998" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">tool responses from outside the trust boundary</text><path d="M113.0,104 L113.0,122" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><text x="10" y="140" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5F5E5A" text-anchor="start">Stage · surface · OWASP IDs</text><text x="236" y="140" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5F5E5A" text-anchor="start">CRISP-AG mitigation</text><rect x="10" y="150" width="206" height="77" rx="9" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text x="21" y="175.46" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#712B13" text-anchor="start">Input handler</text><text x="21" y="193.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">user-input surface</text><text x="21" y="211.36" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#993C1D" text-anchor="start">LLM01 · ASI01</text><path d="M216,188.5 L234,188.5" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="236" y="150" width="194" height="77" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="247" y="174.98" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">Adversarial testing,</text><text x="247" y="192.66" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">structured refusal rules,</text><text x="247" y="210.34" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">DAS action boundaries</text><path d="M113.0,227 L113.0,243" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="10" y="245" width="206" height="93" rx="9" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text x="21" y="278.46" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#712B13" text-anchor="start">Context retrieval</text><text x="21" y="296.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">retrieved-content surface</text><text x="21" y="314.36" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#993C1D" text-anchor="start">LLM01 · MCP06 · MCP10</text><path d="M216,291.5 L234,291.5" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="236" y="245" width="194" height="93" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="247" y="269.14" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">Document provenance,</text><text x="247" y="286.82" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">content scanning,</text><text x="247" y="304.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">context sanitization,</text><text x="247" y="322.18" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">tool limits, output gating</text><path d="M113.0,338 L113.0,354" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="10" y="356" width="206" height="93" rx="9" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5" stroke-dasharray="6 5"/><text x="21" y="389.46" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#712B13" text-anchor="start">Memory and prompt store</text><text x="21" y="407.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">persistent-memory surface</text><text x="21" y="425.36" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#993C1D" text-anchor="start">ASI06 · LLM08</text><path d="M216,402.5 L234,402.5" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="236" y="356" width="194" height="93" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="247" y="380.14" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">Provenance on every write,</text><text x="247" y="397.82" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">independent verifier,</text><text x="247" y="415.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">scan before load, re-test,</text><text x="247" y="433.18" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">access-controlled prompts</text><path d="M113.0,449 L113.0,465" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="10" y="467" width="206" height="77" rx="9" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text x="21" y="492.46" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#712B13" text-anchor="start">Session context</text><text x="21" y="510.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">session-context surface</text><text x="21" y="528.36" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#993C1D" text-anchor="start">MCP06 · MCP10</text><path d="M216,505.5 L234,505.5" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="236" y="467" width="194" height="77" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="247" y="491.98" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">Prompt fence (SEC-13),</text><text x="247" y="509.66" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">context minimization,</text><text x="247" y="527.34" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">reset at each HITL gate</text><path d="M113.0,544 L113.0,562" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="10" y="564" width="206" height="58" rx="9" fill="#FFFFFF" stroke="#8A8A85" stroke-width="1.5"/><text x="21" y="588.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#444441" text-anchor="start">LLM reasoning</text><text x="21" y="607.02" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">system prompt + context</text><text x="236" y="590" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start" font-style="italic">The plan it produces</text><text x="236" y="608" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start" font-style="italic">continues in Figure 6b.</text><rect x="10" y="645" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1.3"/><text x="30" y="656" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">Attack surface</text><rect x="151.92000000000002" y="645" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/><text x="171.92000000000002" y="656" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">Mitigation</text><rect x="264.72" y="645" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.3"/><text x="284.72" y="656" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">Source</text><text x="10" y="682" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">LLM = OWASP LLM Top 10 2026; ASI = OWASP</text><text x="10" y="700" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">Agentic Top 10; MCP = OWASP MCP Top 10.</text><text x="10" y="718" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">Dashed: persists across sessions.</text></svg>
