<svg xmlns="http://www.w3.org/2000/svg" width="572" height="1165" viewBox="0 0 440 896" role="img" aria-labelledby="t d"><title id="t">Three-bucket ROI framework</title><desc id="d">Three value buckets with different evidence standards, never summed. 01 Capacity value, quantify first: active users times hours saved per week times working weeks per year times loaded hourly rate, in conservative, base and optimistic scenarios. 02 Quality value, quantify from history: reductions in compliance incidents, vendor data-quality issues, external consultant spend, rework cycles and duplicate records, each against its baseline. 03 Risk reduction, name and frame: seven exposures presented qualitatively, weighted by the CFO. Separately, 04 Workforce-transition cost: training and AI literacy, reviewer capacity and role redesign, shown alongside the buckets and never netted against capacity value.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6B66"/></marker></defs><rect width="440" height="896" fill="#EEEDE8"/><rect x="10" y="12" width="420" height="195" rx="11" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="24" y="38" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#534AB7" text-anchor="start">01</text><text x="52" y="38" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#3C3489" text-anchor="start">Capacity value</text><rect x="311.7" y="22" width="104.3" height="23" rx="11.5" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.2"/><text x="363.83203125" y="38" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3C3489" text-anchor="middle">Quantify first</text><text x="24" y="61.00000000000001" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3C3489" text-anchor="start">Active users × hours saved per week × working weeks per</text><text x="24" y="78.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3C3489" text-anchor="start">year × loaded hourly rate</text><rect x="25" y="89.4" width="7" height="7" rx="1" fill="#534AB7"/><text x="39" y="96.36000000000001" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Conservative: lower bound (e.g., 25%)</text><rect x="25" y="107.0" width="7" height="7" rx="1" fill="#534AB7"/><text x="39" y="114.04000000000002" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Base case: midpoint (e.g., 32–33%)</text><rect x="25" y="124.7" width="7" height="7" rx="1" fill="#534AB7"/><text x="39" y="131.72000000000003" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Optimistic: upper bound (e.g., 40%)</text><text x="24" y="153.40000000000003" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start" font-style="italic">Three dollar ranges, never one number; calibrated to a</text><text x="24" y="171.08000000000004" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start" font-style="italic">documented industry range and shown only once the adoption</text><text x="24" y="188.76000000000005" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start" font-style="italic">baseline exists.</text><rect x="10" y="219" width="420" height="178" rx="11" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="24" y="245" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0F6E56" text-anchor="start">02</text><text x="52" y="245" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#085041" text-anchor="start">Quality value</text><rect x="259.9" y="229" width="156.1" height="23" rx="11.5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1.2"/><text x="337.9546875" y="245" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#085041" text-anchor="middle">Quantify from history</text><text x="24" y="268.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="start">Reductions in:</text><rect x="25" y="278.7" width="7" height="7" rx="1" fill="#0F6E56"/><text x="39" y="285.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Compliance incidents</text><rect x="25" y="296.4" width="7" height="7" rx="1" fill="#0F6E56"/><text x="39" y="303.36" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Vendor data-quality issues</text><rect x="25" y="314.0" width="7" height="7" rx="1" fill="#0F6E56"/><text x="39" y="321.04" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">External consultant spend</text><rect x="25" y="331.7" width="7" height="7" rx="1" fill="#0F6E56"/><text x="39" y="338.72" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Rework cycles</text><rect x="25" y="349.4" width="7" height="7" rx="1" fill="#0F6E56"/><text x="39" y="356.40000000000003" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Duplicate records</text><text x="24" y="378.08000000000004" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start" font-style="italic">Each against its historical baseline; no baseline, no projection.</text><rect x="10" y="409" width="420" height="231" rx="11" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text x="24" y="435" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#993C1D" text-anchor="start">03</text><text x="52" y="435" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#712B13" text-anchor="start">Risk reduction</text><rect x="291.5" y="419" width="124.5" height="23" rx="11.5" fill="#FFFFFF" stroke="#993C1D" stroke-width="1.2"/><text x="353.75" y="435" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#712B13" text-anchor="middle">Name and frame</text><text x="24" y="458.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#712B13" text-anchor="start">Exposure to:</text><rect x="25" y="468.7" width="7" height="7" rx="1" fill="#993C1D"/><text x="39" y="475.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Regulatory data violations</text><rect x="25" y="486.4" width="7" height="7" rx="1" fill="#993C1D"/><text x="39" y="493.36" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Contractor access incidents</text><rect x="25" y="504.0" width="7" height="7" rx="1" fill="#993C1D"/><text x="39" y="511.04" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Model update disruption</text><rect x="25" y="521.7" width="7" height="7" rx="1" fill="#993C1D"/><text x="39" y="528.72" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Excessive agency or unauthorized action</text><rect x="25" y="539.4" width="7" height="7" rx="1" fill="#993C1D"/><text x="39" y="546.4" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Prompt injection, direct or indirect</text><rect x="25" y="557.1" width="7" height="7" rx="1" fill="#993C1D"/><text x="39" y="564.0799999999999" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Untraceable agents (no registered sponsor)</text><rect x="25" y="574.7" width="7" height="7" rx="1" fill="#993C1D"/><text x="39" y="581.7599999999999" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Consequential-decision failures</text><text x="24" y="603.4399999999998" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start" font-style="italic">Presented qualitatively against the risk register; the CFO</text><text x="24" y="621.1199999999998" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start" font-style="italic">applies the risk weighting.</text><path d="M10,660 L430,660" stroke="#6B6B66" stroke-width="1.2" stroke-dasharray="4 4"/><text x="220.0" y="679" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#5F5E5A" text-anchor="middle" font-style="italic">Separate cost line</text><rect x="10" y="694" width="420" height="142" rx="11" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="6 5"/><text x="24" y="720" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#5F5E5A" text-anchor="start">04</text><text x="52" y="720" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#444441" text-anchor="start">Workforce-transition cost</text><rect x="295.4" y="704" width="120.6" height="23" rx="11.5" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.2"/><text x="355.68671875" y="720" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#444441" text-anchor="middle">Show alongside</text><rect x="25" y="736.0" width="7" height="7" rx="1" fill="#5F5E5A"/><text x="39" y="743.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Training and AI literacy</text><rect x="25" y="753.7" width="7" height="7" rx="1" fill="#5F5E5A"/><text x="39" y="760.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Reviewer capacity (FTE from the §5.7 model)</text><rect x="25" y="771.3" width="7" height="7" rx="1" fill="#5F5E5A"/><text x="39" y="778.3599999999999" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Role redesign</text><text x="24" y="800.0399999999998" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start" font-style="italic">A committed-spend estimate with its own evidence standard;</text><text x="24" y="817.7199999999998" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start" font-style="italic">never netted against capacity value.</text><text x="10" y="864" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">The three buckets use different evidence standards and are never</text><text x="10" y="882" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">summed into one figure (§9.5).</text></svg>
