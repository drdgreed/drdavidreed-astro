<svg xmlns="http://www.w3.org/2000/svg" width="572" height="1152" viewBox="0 0 440 886" role="img" aria-labelledby="t d"><title id="t">Capability Frontier spectrum</title><desc id="d">Four positions ordered from less to more suitable for delegation, each with its criterion, default verification and example tasks. Unsuitable: never delegate (relationship management, social judgment). Outside Frontier: human-authored final decision, agent provides research only (negotiation strategy, regulatory determination). Frontier Edge: 50 to 100 percent expert review, HITL mandatory (contract interpretation, supplier risk assessment). Within Frontier: 10 to 30 percent spot-check and automated monitoring (document validation, sanctions screening). Two bands apply at every position: the consequential-decision flag caps autonomy at HITL-REQUIRED, makes the impact assessment mandatory, requires disclosure to affected persons and retains decision records; the irreversibility rule holds irreversible high-consequence actions at HUMAN-ONLY whatever the pass rate.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6B66"/></marker></defs><rect width="440" height="886" fill="#EEEDE8"/><text x="10" y="22" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">Each: criterion, default verification (bold), examples (italic).</text><text x="10" y="48" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5F5E5A" text-anchor="start">Less suitable for delegation</text><rect x="40" y="60" width="390" height="118" rx="9" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text x="52" y="85.28" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#712B13" text-anchor="start">Unsuitable</text><text x="52" y="103.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Requires empathy, live social judgment, physical presence</text><text x="52" y="121.18" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">or non-delegable legal authority.</text><text x="52" y="141.86" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#712B13" text-anchor="start">Never delegate.</text><text x="52" y="162.54000000000002" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start" font-style="italic">Relationship management · social judgment</text><rect x="40" y="188" width="390" height="136" rx="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="52" y="213.44" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#444441" text-anchor="start">Outside Frontier</text><text x="52" y="231.66" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Cannot be sufficiently specified, or performance is below</text><text x="52" y="249.34" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">the acceptable threshold (about 60%).</text><text x="52" y="270.02" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#444441" text-anchor="start">Human-authored final decision; the agent provides</text><text x="52" y="287.7" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#444441" text-anchor="start">research only.</text><text x="52" y="308.38" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start" font-style="italic">Negotiation strategy · regulatory determination</text><rect x="40" y="334" width="390" height="118" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="52" y="359.28" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#3C3489" text-anchor="start">Frontier Edge</text><text x="52" y="377.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Requires judgment; performance is variable; or errors carry</text><text x="52" y="395.18" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">legal or financial consequence.</text><text x="52" y="415.86" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3C3489" text-anchor="start">50–100% expert review; HITL mandatory.</text><text x="52" y="436.54" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start" font-style="italic">Contract interpretation · supplier risk assessment</text><rect x="40" y="462" width="390" height="118" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="52" y="487.28" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#085041" text-anchor="start">Within Frontier</text><text x="52" y="505.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Fully specifiable; strong on domain-representative tests</text><text x="52" y="523.1800000000001" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">(about 85% or more); errors detectable and reversible.</text><text x="52" y="543.86" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#085041" text-anchor="start">10–30% spot-check; automated monitoring.</text><text x="52" y="564.54" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start" font-style="italic">Document validation · sanctions screening</text><path d="M19,62 L19,579" fill="none" stroke="#6B6B66" stroke-width="2" marker-end="url(#ah)"/><text x="10" y="602" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5F5E5A" text-anchor="start">More suitable for delegation</text><rect x="10" y="616" width="420" height="171" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="6 5"/><text x="22" y="641.26" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#3C3489" text-anchor="start">Consequential-decision flag (§5.4.3)</text><text x="22" y="659.48" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#534AB7" text-anchor="start">Applies at any position</text><text x="22" y="680.16" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">When a task materially influences a decision about a person:</text><text x="22" y="697.8399999999999" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">employment, housing, credit, insurance, education, health care,</text><text x="22" y="715.5199999999999" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">legal status or essential services.</text><text x="22" y="736.1999999999998" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#3C3489" text-anchor="start">Autonomy capped at HITL-REQUIRED; impact assessment</text><text x="22" y="753.8799999999998" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#3C3489" text-anchor="start">mandatory; disclosure to affected persons; decision records</text><text x="22" y="771.5599999999997" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#3C3489" text-anchor="start">retained.</text><rect x="10" y="797" width="420" height="77" rx="9" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5" stroke-dasharray="6 5"/><text x="22" y="822.46" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#712B13" text-anchor="start">Irreversibility rule (§5.1.2)</text><text x="22" y="840.6800000000001" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#712B13" text-anchor="start">Irreversible high-consequence actions are HUMAN-ONLY,</text><text x="22" y="858.36" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#712B13" text-anchor="start">whatever the pass rate.</text></svg>
