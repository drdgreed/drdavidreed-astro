<svg xmlns="http://www.w3.org/2000/svg" width="572" height="1274" viewBox="0 0 440 980" role="img" aria-labelledby="t d"><title id="t">Agent class taxonomy decision tree</title><desc id="d">Four questions asked in turn. Q1: does the agent run multiple reasoning and action steps in an autonomous loop? If not, Class 1, single-step tool-calling, basic governance. Q2: can it execute code or alter production state directly? If so, Class 4, autonomous code-executing, critical governance; writes confined to staging under deny-by-default production-write restrictions answer no, but the agent carries the Class 4 write controls and the AIR records it. Q3: does it coordinate two or more role-distinct agents? If so, Class 3, hierarchical multi-agent, enhanced governance. Q4: does it run an extended autonomous loop with tool calls? If so, Class 2, ReAct loop, standard governance; if not, Class 1. Each class lists its minimum controls.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6B66"/></marker></defs><rect width="440" height="980" fill="#EEEDE8"/><rect x="10" y="12" width="178" height="55" rx="9" fill="#FFFFFF" stroke="#8A8A85" stroke-width="1.5"/><text x="99.0" y="34.28" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#444441" text-anchor="middle">Phase 1: classify</text><text x="99.0" y="54.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#444441" text-anchor="middle">the agent</text><path d="M99.0,64 L99.0,84" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><text x="222" y="78" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5F5E5A" text-anchor="start">Class · minimum controls</text><rect x="10" y="86" width="178" height="99" rx="9" fill="#FFFFFF" stroke="#8A8A85" stroke-width="1.5"/><text x="22" y="110.07999999999998" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5F5E5A" text-anchor="start">Q1</text><text x="22" y="129.26" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#2B2B2B" text-anchor="start">Multiple reasoning</text><text x="22" y="148.98" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#2B2B2B" text-anchor="start">and action steps in an</text><text x="22" y="168.7" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#2B2B2B" text-anchor="start">autonomous loop?</text><rect x="222" y="86" width="208" height="99" rx="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="233" y="112.12" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#444441" text-anchor="start">Class 1 · Basic</text><text x="233" y="130.34" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#444441" text-anchor="start">Single-step tool-calling</text><text x="233" y="151.02" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">DAS, output review, simple</text><text x="233" y="168.70000000000002" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">evaluation, impact screen</text><path d="M188,135.5 L220,135.5" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><text x="205.0" y="128.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5F5E5A" text-anchor="middle">No</text><path d="M99.0,185 L99.0,217" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><text x="107.0" y="205" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5F5E5A" text-anchor="start">Yes</text><rect x="10" y="219" width="178" height="115" rx="9" fill="#FFFFFF" stroke="#8A8A85" stroke-width="1.5"/><text x="22" y="251.07999999999998" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5F5E5A" text-anchor="start">Q2</text><text x="22" y="270.26" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#2B2B2B" text-anchor="start">Can it execute code</text><text x="22" y="289.98" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#2B2B2B" text-anchor="start">or alter production</text><text x="22" y="309.70000000000005" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#2B2B2B" text-anchor="start">state directly?</text><rect x="222" y="219" width="208" height="115" rx="9" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text x="233" y="244.28" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#712B13" text-anchor="start">Class 4 · Critical</text><text x="233" y="262.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#712B13" text-anchor="start">Autonomous code-executing</text><text x="233" y="283.18" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Class 3 controls plus</text><text x="233" y="300.86" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">sandboxing, red-team review,</text><text x="233" y="318.54" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">production-write restrictions</text><path d="M188,276.5 L220,276.5" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><text x="205.0" y="269.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5F5E5A" text-anchor="middle">Yes</text><rect x="222" y="348" width="208" height="128" rx="9" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5" stroke-dasharray="6 5"/><text x="233" y="371.96" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#712B13" text-anchor="start">Staging-only writes</text><text x="233" y="389.64" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#712B13" text-anchor="start">(deny-by-default, human</text><text x="233" y="407.32" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#712B13" text-anchor="start">promotion): answer No, but</text><text x="233" y="425.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#712B13" text-anchor="start">carry the Class 4 write</text><text x="233" y="442.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#712B13" text-anchor="start">controls and record that in the</text><text x="233" y="460.36" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#712B13" text-anchor="start">AIR.</text><path d="M99.0,412.0 L220,412.0" fill="none" stroke="#993C1D" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><path d="M99.0,334 L99.0,488" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><text x="107.0" y="354" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5F5E5A" text-anchor="start">No</text><rect x="10" y="490" width="178" height="133" rx="9" fill="#FFFFFF" stroke="#8A8A85" stroke-width="1.5"/><text x="22" y="531.08" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5F5E5A" text-anchor="start">Q3</text><text x="22" y="550.26" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#2B2B2B" text-anchor="start">Coordinates two or</text><text x="22" y="569.98" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#2B2B2B" text-anchor="start">more role-distinct</text><text x="22" y="589.7" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#2B2B2B" text-anchor="start">agents?</text><rect x="222" y="490" width="208" height="133" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="233" y="515.4399999999999" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#3C3489" text-anchor="start">Class 3 · Enhanced</text><text x="233" y="533.66" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#3C3489" text-anchor="start">Hierarchical multi-agent</text><text x="233" y="554.3399999999999" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">Orchestration Contracts,</text><text x="233" y="572.0199999999999" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">per-agent identity,</text><text x="233" y="589.6999999999998" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">cross-agent audit trail, circuit</text><text x="233" y="607.3799999999998" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">breaker</text><path d="M188,556.5 L220,556.5" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><text x="205.0" y="549.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5F5E5A" text-anchor="middle">Yes</text><path d="M99.0,623 L99.0,655" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><text x="107.0" y="643" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5F5E5A" text-anchor="start">No</text><rect x="10" y="657" width="178" height="115" rx="9" fill="#FFFFFF" stroke="#8A8A85" stroke-width="1.5"/><text x="22" y="689.08" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5F5E5A" text-anchor="start">Q4</text><text x="22" y="708.26" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#2B2B2B" text-anchor="start">Extended</text><text x="22" y="727.98" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#2B2B2B" text-anchor="start">autonomous loop</text><text x="22" y="747.7" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#2B2B2B" text-anchor="start">with tool calls?</text><rect x="222" y="657" width="208" height="115" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="233" y="682.28" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#085041" text-anchor="start">Class 2 · Standard</text><text x="233" y="700.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="start">ReAct-loop agent</text><text x="233" y="721.18" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">DAS, AIR, step limits, HITL</text><text x="233" y="738.8599999999999" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">triggers, evaluation suite,</text><text x="233" y="756.5399999999998" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">impact assessment</text><path d="M188,714.5 L220,714.5" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><text x="205.0" y="707.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5F5E5A" text-anchor="middle">Yes</text><path d="M99.0,772 L99.0,804" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><text x="107.0" y="792" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5F5E5A" text-anchor="start">No</text><rect x="10" y="806" width="178" height="40" rx="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="99.0" y="830.64" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#444441" text-anchor="middle">Class 1 · Basic</text><text x="10" y="876" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">Production state: a system of record, deployed configuration, or</text><text x="10" y="894" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">anything a human or downstream system acts on without further</text><text x="10" y="912" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">review.</text><rect x="10" y="931" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.3"/><text x="30" y="942" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">Basic</text><rect x="86.4" y="931" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/><text x="106.4" y="942" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">Standard</text><rect x="184.64000000000001" y="931" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.3"/><text x="204.64000000000001" y="942" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">Enhanced</text><rect x="282.88" y="931" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1.3"/><text x="302.88" y="942" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">Critical</text><text x="10" y="966" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">Color: governance intensity of the class.</text></svg>
