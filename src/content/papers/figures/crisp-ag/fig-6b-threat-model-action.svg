<svg xmlns="http://www.w3.org/2000/svg" width="572" height="1065" viewBox="0 0 440 819" role="img" aria-labelledby="t d"><title id="t">Agentic threat model, part 2: action surfaces</title><desc id="d">The planned action from LLM reasoning passes five surfaces before it reaches downstream systems: orchestration (ASI07, ASI08), tool execution (LLM03, ASI02, ASI03), code execution (ASI05, MCP05), the output handler (LLM10, LLM02, ASI01) and the human review gate (ASI09). Each is paired with its CRISP-AG mitigation. ASI04 is covered by the Agentic Security Specification and ASI10 by the DAS, standing governance invariants and AIR containment.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6B66"/></marker></defs><rect width="440" height="819" fill="#EEEDE8"/><rect x="10" y="12" width="206" height="58" rx="9" fill="#FFFFFF" stroke="#8A8A85" stroke-width="1.5"/><text x="21" y="36.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#444441" text-anchor="start">Planned action</text><text x="21" y="55.019999999999996" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">from LLM reasoning (6a)</text><path d="M113.0,70 L113.0,88" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><text x="10" y="106" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5F5E5A" text-anchor="start">Stage · surface · OWASP IDs</text><text x="236" y="106" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5F5E5A" text-anchor="start">CRISP-AG mitigation</text><rect x="10" y="116" width="206" height="93" rx="9" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text x="21" y="149.46" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#712B13" text-anchor="start">Orchestration</text><text x="21" y="167.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">inter-agent surface</text><text x="21" y="185.36" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#993C1D" text-anchor="start">ASI07 · ASI08</text><path d="M216,162.5 L234,162.5" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="236" y="116" width="194" height="93" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="247" y="140.14" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">Orchestration Contracts</text><text x="247" y="157.82" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">with output validation,</text><text x="247" y="175.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">per-agent identity,</text><text x="247" y="193.18" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">pipeline circuit breaker</text><path d="M113.0,209 L113.0,225" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="10" y="227" width="206" height="77" rx="9" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text x="21" y="252.46" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#712B13" text-anchor="start">Tool execution</text><text x="21" y="270.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">tool-call surface</text><text x="21" y="288.36" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#993C1D" text-anchor="start">LLM03 · ASI02 · ASI03</text><path d="M216,265.5 L234,265.5" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="236" y="227" width="194" height="77" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="247" y="251.97999999999996" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">Least-privilege tools,</text><text x="247" y="269.65999999999997" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">scoped AIR credentials,</text><text x="247" y="287.34" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">HITL gates, audit log</text><path d="M113.0,304 L113.0,320" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="10" y="322" width="206" height="77" rx="9" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text x="21" y="347.46" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#712B13" text-anchor="start">Code execution</text><text x="21" y="365.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">code-execution surface</text><text x="21" y="383.36" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#993C1D" text-anchor="start">ASI05 · MCP05</text><path d="M216,360.5 L234,360.5" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="236" y="322" width="194" height="77" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="247" y="346.98" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">Sandboxing, red-team</text><text x="247" y="364.66" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">review, deny-by-default</text><text x="247" y="382.34000000000003" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">production writes</text><path d="M113.0,399 L113.0,415" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="10" y="417" width="206" height="77" rx="9" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text x="21" y="442.46" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#712B13" text-anchor="start">Output handler</text><text x="21" y="460.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">output / action surface</text><text x="21" y="478.36" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#993C1D" text-anchor="start">LLM10 · LLM02 · ASI01</text><path d="M216,455.5 L234,455.5" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="236" y="417" width="194" height="77" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="247" y="441.98" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">Output gating against</text><text x="247" y="459.66" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">the request scope;</text><text x="247" y="477.34000000000003" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">data-tier output limits</text><path d="M113.0,494 L113.0,510" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="10" y="512" width="206" height="93" rx="9" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text x="21" y="545.46" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#712B13" text-anchor="start">Human review gate</text><text x="21" y="563.6800000000001" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">human-review surface</text><text x="21" y="581.36" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#993C1D" text-anchor="start">ASI09</text><path d="M216,558.5 L234,558.5" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="236" y="512" width="194" height="93" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="247" y="536.14" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">Reviewer-behavior metrics,</text><text x="247" y="553.8199999999999" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">known-bad injections,</text><text x="247" y="571.4999999999999" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">evidence-first interface,</text><text x="247" y="589.1799999999998" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#085041" text-anchor="start">staffed capacity (§5.7)</text><path d="M113.0,605 L113.0,623" fill="none" stroke="#6B6B66" stroke-width="1.6" marker-end="url(#ah)"/><rect x="10" y="625" width="206" height="58" rx="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="21" y="649.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#444441" text-anchor="start">Downstream systems</text><text x="21" y="668.02" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2B2B2B" text-anchor="start">systems of record, storage</text><rect x="10" y="706" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1.3"/><text x="30" y="717" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">Attack surface</text><rect x="151.92000000000002" y="706" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/><text x="171.92000000000002" y="717" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">Mitigation</text><text x="10" y="743" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">Covered elsewhere: ASI04 by the Agentic Security</text><text x="10" y="761" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">Specification (SEC-16, SEC-19); ASI10 by the DAS,</text><text x="10" y="779" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">standing governance invariants and AIR</text><text x="10" y="797" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">containment (§5.5, §6.3).</text></svg>
